<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Casse Brique Cyber</title>
<style>
body {
    margin: 0;
    background: #020617;
    color: #0ff;
    font-family: monospace;
    overflow: hidden;
}
canvas {
    display: block;
    margin: auto;
    background: #020617;
    box-shadow: 0 0 30px #00ffff;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;

let paddle = { x: 350, y: 570, w: 100, h: 10 };
let ball = { x: 400, y: 300, r: 8, dx: 4, dy: -4 };

let bricks = [];
for (let i = 0; i < 5; i++) {
  for (let j = 0; j < 10; j++) {
    bricks.push({ x: j * 70 + 30, y: i * 30 + 30, w: 60, h: 20, alive: true });
  }
}

let right = false;
let left = false;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') right = true;
  if (e.key === 'ArrowLeft') left = true;
});

document.addEventListener('keyup', e => {
  if (e.key === 'ArrowRight') right = false;
  if (e.key === 'ArrowLeft') left = false;
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Paddle
  ctx.fillStyle = '#00ffff';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#0ff';
  ctx.fill();
  ctx.closePath();

  // Bricks
  bricks.forEach(b => {
    if (b.alive) {
      ctx.fillStyle = '#00ffff';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  });
}

function collision() {
  bricks.forEach(b => {
    if (b.alive &&
        ball.x > b.x &&
        ball.x < b.x + b.w &&
        ball.y > b.y &&
        ball.y < b.y + b.h) {
      ball.dy *= -1;
      b.alive = false;
    }
  });
}

function update() {
  if (right) paddle.x += 6;
  if (left) paddle.x -= 6;

  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.x + ball.r > canvas.width || ball.x - ball.r < 0) ball.dx *= -1;
  if (ball.y - ball.r < 0) ball.dy *= -1;

  if (
    ball.x > paddle.x &&
    ball.x < paddle.x + paddle.w &&
    ball.y + ball.r > paddle.y
  ) {
    ball.dy *= -1;
  }

  if (ball.y > canvas.height) {
    alert('GAME OVER');
    document.location.reload();
  }

  collision();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
