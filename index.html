<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #00f5ff;
      --pink: #ff2bd6;
      --lime: #b6ff00;
      --violet: #7c3cff;
      --orange: #ffb000;
      --dark: #070812;
      --panel: rgba(10, 20, 38, 0.82);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      display: grid;
      place-items: center;
      font-family: "Orbitron", "Rajdhani", "Segoe UI", sans-serif;
      color: #e8fbff;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 43, 214, 0.24), transparent 28rem),
        radial-gradient(circle at 80% 15%, rgba(0, 245, 255, 0.22), transparent 26rem),
        linear-gradient(145deg, #050610 0%, #0c1024 47%, #06030d 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 245, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 43, 214, 0.07) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
      animation: drift 12s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.035) 0,
        rgba(255,255,255,0.035) 1px,
        transparent 1px,
        transparent 5px
      );
      mix-blend-mode: overlay;
      opacity: 0.38;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(42px); }
    }

    .shell {
      width: min(96vw, 1040px);
      padding: 22px;
      border: 1px solid rgba(0, 245, 255, 0.36);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(11, 18, 38, 0.92), rgba(6, 8, 20, 0.86));
      box-shadow:
        0 0 30px rgba(0, 245, 255, 0.18),
        inset 0 0 32px rgba(124, 60, 255, 0.12);
      position: relative;
      isolation: isolate;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 28px;
      background: linear-gradient(120deg, var(--cyan), transparent 28%, var(--pink), transparent 72%, var(--lime));
      filter: blur(14px);
      opacity: 0.36;
      z-index: -1;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 3.1rem);
      line-height: 1;
      text-shadow: 0 0 16px rgba(0, 245, 255, 0.85), 0 0 28px rgba(255, 43, 214, 0.55);
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      font-size: 0.82rem;
    }

    .chip {
      padding: 10px 14px;
      border: 1px solid rgba(0, 245, 255, 0.42);
      background: var(--panel);
      border-radius: 999px;
      box-shadow: inset 0 0 16px rgba(0, 245, 255, 0.1);
      white-space: nowrap;
    }

    .chip strong { color: var(--lime); }

    .arena {
      position: relative;
      border: 1px solid rgba(255, 43, 214, 0.4);
      border-radius: 18px;
      overflow: hidden;
      background: #050712;
      box-shadow: inset 0 0 40px rgba(0, 245, 255, 0.12), 0 0 22px rgba(255, 43, 214, 0.16);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 72vh;
      cursor: none;
      touch-action: none;
      background:
        radial-gradient(circle at 50% 110%, rgba(0, 245, 255, 0.18), transparent 45%),
        linear-gradient(rgba(0,245,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,43,214,0.08) 1px, transparent 1px),
        #050712;
      background-size: auto, 36px 36px, 36px 36px, auto;
    }

    .overlay,
    .quiz {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(circle, rgba(3, 8, 18, 0.58), rgba(3, 8, 18, 0.91));
      transition: opacity 180ms ease, visibility 180ms ease;
      z-index: 4;
      overflow-y: auto;
    }

    .overlay.hidden,
    .quiz.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      max-width: 740px;
      padding: 26px;
      border-radius: 22px;
      border: 1px solid rgba(0, 245, 255, 0.5);
      background: rgba(5, 8, 20, 0.9);
      box-shadow: 0 0 34px rgba(0, 245, 255, 0.22), inset 0 0 26px rgba(255, 43, 214, 0.12);
    }

    .menu-card {
      width: min(100%, 700px);
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .card h2,
    .quiz h2 {
      margin: 0 0 10px;
      font-size: clamp(1.4rem, 4vw, 2.35rem);
      color: var(--cyan);
      text-shadow: 0 0 18px currentColor;
      text-transform: uppercase;
    }

    .card p,
    .quiz p {
      margin: 10px 0;
      line-height: 1.55;
      color: #bdd9e5;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      font: 800 0.95rem/1 "Segoe UI", sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #06101a;
      background: linear-gradient(90deg, var(--cyan), var(--lime));
      box-shadow: 0 0 22px rgba(0, 245, 255, 0.45);
      cursor: pointer;
    }

    button:hover { filter: brightness(1.12); }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .mode-card {
      display: grid;
      gap: 8px;
      min-height: 118px;
      width: 100%;
      padding: 18px;
      border: 2px solid rgba(0, 245, 255, 0.62);
      border-radius: 16px;
      color: #eaffff;
      text-align: left;
      background: rgba(6, 12, 28, 0.96);
      box-shadow: 0 0 22px rgba(0, 245, 255, 0.18);
      font: inherit;
      letter-spacing: normal;
      text-transform: none;
    }

    .mode-card:hover,
    .mode-card:focus-visible {
      filter: none;
      outline: 3px solid var(--lime);
      outline-offset: 3px;
    }

    .mode-card strong {
      color: var(--lime);
      font-size: 1.18rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mode-card span { color: #a8d5e7; line-height: 1.45; }

    .mode-card .play-label {
      color: #06101a;
      background: linear-gradient(90deg, var(--cyan), var(--lime));
      border-radius: 999px;
      padding: 10px 16px;
      justify-self: start;
      font: 800 0.9rem/1 "Segoe UI", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .controls {
      margin: 14px 4px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: #8eb8c8;
      font-size: 0.82rem;
    }

    .touch-pad {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 48px);
      gap: 8px;
      z-index: 8;
      pointer-events: none;
    }

    .touch-pad button {
      pointer-events: auto;
      padding: 0;
      opacity: 0.9;
      background: rgba(0, 245, 255, 0.78);
    }

    .touch-pad [data-dir="up"] { grid-column: 2; }
    .touch-pad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .touch-pad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .touch-pad [data-dir="right"] { grid-column: 3; grid-row: 2; }

    .quiz {
      z-index: 6;
      background: radial-gradient(circle, rgba(255, 43, 214, 0.2), rgba(3, 8, 18, 0.94));
    }

    .quiz-options {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .quiz-options button {
      width: 100%;
      color: #eaffff;
      text-align: left;
      white-space: normal;
      line-height: 1.3;
      background: linear-gradient(90deg, rgba(124, 60, 255, 0.9), rgba(0, 245, 255, 0.5));
    }

    .quiz-result {
      min-height: 1.4em;
      font-weight: 800;
    }

    kbd {
      border: 1px solid rgba(0, 245, 255, 0.45);
      border-bottom-width: 3px;
      border-radius: 6px;
      padding: 2px 7px;
      color: #eaffff;
      background: rgba(0, 245, 255, 0.08);
    }

    @media (max-width: 720px) {
      body {
        min-height: 100svh;
        padding: 10px;
      }
      .shell {
        width: min(100%, 680px);
        max-height: calc(100svh - 20px);
        padding: 12px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }
      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
      }
      h1 { font-size: clamp(1.45rem, 8vw, 2.35rem); }
      .hud { justify-content: flex-start; gap: 8px; }
      .chip { padding: 7px 9px; font-size: 0.72rem; }
      .overlay,
      .quiz { padding: 12px; }
      .card { padding: 18px; }
      .menu-card { padding: 16px; }
      .menu-card p { display: none; }
      .mode-grid {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 14px;
      }
      .mode-card {
        min-height: 0;
        gap: 6px;
        padding: 13px;
      }
      .mode-card span {
        font-size: 0.82rem;
        line-height: 1.25;
      }
      .mode-card .play-label {
        width: 100%;
        margin-top: 4px;
        padding: 12px 18px;
        text-align: center;
      }
      .controls {
        margin-top: 10px;
        font-size: 0.72rem;
      }
      .touch-pad.visible { display: grid; }
      canvas { max-height: 54svh; }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Cyber Arcade">
    <header>
      <h1 id="gameTitle">Cyber Arcade</h1>
      <section class="hud" aria-label="Statistiques">
        <div class="chip">Score <strong id="score">0</strong></div>
        <div class="chip" id="metricOneChip">Vies <strong id="metricOne">3</strong></div>
        <div class="chip" id="metricTwoChip">Niveau <strong id="metricTwo">1</strong></div>
        <div class="chip">Mode <strong id="modeLabel">Menu</strong></div>
      </section>
    </header>

    <section class="arena">
      <canvas id="game" width="960" height="540" aria-label="Zone de jeu"></canvas>

      <div class="overlay" id="menuOverlay">
        <div class="card menu-card">
          <h2>Choisis un jeu</h2>
          <p>Deux grands boutons directs, sans carte imbriquée : lance la partie en un seul clic.</p>
          <div class="mode-grid">
            <button class="mode-card" type="button" data-mode="brick" aria-label="Jouer au Casse-brique">
              <strong>Casse-brique</strong>
              <span>Balle plasma, briques néon, bonus.</span>
              <span class="play-label">Jouer</span>
            </button>
            <button class="mode-card" type="button" data-mode="snake" aria-label="Jouer à Snake Cyber">
              <strong>Snake Cyber</strong>
              <span>Serpent mobile-first + quiz cybersécurité.</span>
              <span class="play-label">Jouer</span>
            </button>
          </div>
        </div>
      </div>

      <div class="overlay hidden" id="messageOverlay">
        <div class="card">
          <h2 id="overlayTitle">Connexion au réseau</h2>
          <p id="overlayText">Prêt à lancer la partie.</p>
          <button id="startButton">Lancer la partie</button>
          <button id="backButton">Menu</button>
        </div>
      </div>

      <div class="quiz hidden" id="quizModal" role="dialog" aria-modal="true" aria-labelledby="quizTitle">
        <div class="card">
          <h2 id="quizTitle">Quiz Cyber</h2>
          <p id="quizQuestion"></p>
          <div class="quiz-options" id="quizOptions"></div>
          <p class="quiz-result" id="quizResult" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <div class="controls" id="controlsText">
      <span>Choisis un jeu pour afficher les contrôles</span>
      <span><kbd>Espace</kbd> pause / reprise</span>
    </div>
  </main>

  <div class="touch-pad" id="touchPad" aria-label="Contrôles tactiles Snake">
    <button data-dir="up" aria-label="Haut">▲</button>
    <button data-dir="left" aria-label="Gauche">◀</button>
    <button data-dir="down" aria-label="Bas">▼</button>
    <button data-dir="right" aria-label="Droite">▶</button>
  </div>

  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const metricOneEl = document.querySelector('#metricOne');
    const metricTwoEl = document.querySelector('#metricTwo');
    const metricOneChip = document.querySelector('#metricOneChip');
    const metricTwoChip = document.querySelector('#metricTwoChip');
    const modeLabel = document.querySelector('#modeLabel');
    const gameTitle = document.querySelector('#gameTitle');
    const menuOverlay = document.querySelector('#menuOverlay');
    const messageOverlay = document.querySelector('#messageOverlay');
    const overlayTitle = document.querySelector('#overlayTitle');
    const overlayText = document.querySelector('#overlayText');
    const startButton = document.querySelector('#startButton');
    const backButton = document.querySelector('#backButton');
    const controlsText = document.querySelector('#controlsText');
    const touchPad = document.querySelector('#touchPad');
    const quizModal = document.querySelector('#quizModal');
    const quizQuestion = document.querySelector('#quizQuestion');
    const quizOptions = document.querySelector('#quizOptions');
    const quizResult = document.querySelector('#quizResult');

    const quizBank = [
      {
        theme: 'ransomware',
        word: 'sauvegarde immuable',
        question: 'Face à un ransomware, pourquoi une sauvegarde immuable est-elle cruciale ?',
        good: 'Elle empêche l’attaquant de chiffrer ou supprimer la copie de secours pendant sa fenêtre de rétention.',
        almost: 'Elle remplace totalement l’EDR et bloque toutes les pièces jointes dangereuses.',
        bad: 'Elle paie automatiquement la rançon pour récupérer les fichiers plus vite.'
      },
      {
        theme: 'ransomware',
        word: 'segmentation réseau',
        question: 'Quel rôle joue la segmentation réseau contre un ransomware ?',
        good: 'Elle limite les déplacements latéraux et réduit le périmètre que le malware peut chiffrer.',
        almost: 'Elle chiffre les postes utilisateurs avant que le ransomware ne le fasse.',
        bad: 'Elle ouvre tous les partages réseau pour accélérer la restauration.'
      },
      {
        theme: 'ISO 27001',
        word: 'SMSI',
        question: 'Dans ISO 27001, que désigne le SMSI ?',
        good: 'Un système de management de la sécurité de l’information piloté par les risques, les politiques et l’amélioration continue.',
        almost: 'Une liste de pare-feux obligatoires identique pour toutes les entreprises.',
        bad: 'Un service de messagerie SMS pour envoyer les mots de passe aux équipes.'
      },
      {
        theme: 'ISO 27001',
        word: 'analyse de risques',
        question: 'Pourquoi l’analyse de risques est-elle centrale dans ISO 27001 ?',
        good: 'Elle aide à choisir des mesures adaptées aux menaces, impacts et objectifs métier.',
        almost: 'Elle garantit qu’aucun incident ne pourra se produire après la certification.',
        bad: 'Elle sert uniquement à décorer le dossier d’audit avec des graphiques.'
      },
      {
        theme: 'cloud security',
        word: 'IAM minimal',
        question: 'Quel est l’objectif du moindre privilège IAM dans le cloud ?',
        good: 'Accorder seulement les permissions nécessaires pour limiter l’impact d’un compte compromis.',
        almost: 'Donner un rôle administrateur temporaire à tout le monde pour fluidifier les déploiements.',
        bad: 'Partager une clé root dans un canal de discussion pour éviter les demandes d’accès.'
      },
      {
        theme: 'cloud security',
        word: 'chiffrement KMS',
        question: 'À quoi sert un service KMS dans une architecture cloud ?',
        good: 'À créer, protéger, faire tourner et auditer les clés de chiffrement utilisées par les services.',
        almost: 'À désactiver les journaux afin que les clés restent discrètes.',
        bad: 'À publier les secrets dans le dépôt Git pour simplifier les rotations.'
      },
      {
        theme: 'AI security',
        word: 'prompt injection',
        question: 'Qu’est-ce qu’une prompt injection contre un système d’IA ?',
        good: 'Une tentative de détourner les instructions du modèle via des entrées malveillantes ou du contenu non fiable.',
        almost: 'Une méthode de compression qui rend tous les prompts plus courts et plus sûrs.',
        bad: 'Une injection médicale qui augmente la mémoire GPU du serveur.'
      },
      {
        theme: 'AI security',
        word: 'red teaming IA',
        question: 'Pourquoi pratiquer le red teaming sur une application IA ?',
        good: 'Pour tester abus, fuites, contournements et comportements dangereux avant la mise en production.',
        almost: 'Pour entraîner le modèle uniquement avec des écrans rouges très contrastés.',
        bad: 'Pour supprimer toutes les protections afin de rendre le chatbot plus amusant.'
      }
    ];

    const app = {
      mode: 'menu',
      raf: 0,
      keys: new Set(),
      running: false,
      paused: false
    };

    const brick = {
      score: 0,
      lives: 3,
      level: 1,
      particles: [],
      powerUps: [],
      activeEffects: [],
      paddle: { w: 145, h: 16, x: 407, y: 500, speed: 9 },
      ball: { x: 480, y: 470, r: 8, vx: 5.4, vy: -5.8, trail: [] },
      bricks: []
    };

    const snake = {
      score: 0,
      lives: 3,
      streak: 0,
      tickMs: 150,
      lastTick: 0,
      cell: 24,
      cols: 40,
      rows: 22,
      direction: { x: 1, y: 0 },
      nextDirection: { x: 1, y: 0 },
      body: [],
      pendingGrowth: 0,
      food: null,
      quizItem: null,
      quizOpen: false,
      particles: []
    };

    function setHud(score, metricOneLabel, metricOneValue, metricTwoLabel, metricTwoValue, mode) {
      scoreEl.textContent = score;
      metricOneChip.firstChild.textContent = `${metricOneLabel} `;
      metricOneEl.textContent = metricOneValue;
      metricTwoChip.firstChild.textContent = `${metricTwoLabel} `;
      metricTwoEl.textContent = metricTwoValue;
      modeLabel.textContent = mode;
    }

    function showMessage(title, text, button = 'Lancer la partie') {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      startButton.textContent = button;
      messageOverlay.classList.remove('hidden');
    }

    function hideMessage() {
      messageOverlay.classList.add('hidden');
    }

    function showMenu() {
      cancelAnimationFrame(app.raf);
      app.mode = 'menu';
      app.running = false;
      app.paused = false;
      app.keys.clear();
      gameTitle.textContent = 'Cyber Arcade';
      menuOverlay.classList.remove('hidden');
      messageOverlay.classList.add('hidden');
      quizModal.classList.add('hidden');
      touchPad.classList.remove('visible');
      controlsText.innerHTML = '<span>Choisis un jeu pour afficher les contrôles</span><span><kbd>Espace</kbd> pause / reprise</span>';
      setHud(0, 'Vies', 3, 'Niveau', 1, 'Menu');
      drawMenuBackground();
    }

    function chooseMode(mode) {
      app.mode = mode;
      app.running = false;
      app.paused = false;
      app.keys.clear();
      menuOverlay.classList.add('hidden');
      hideMessage();
      if (mode === 'brick') prepareBrick();
      if (mode === 'snake') prepareSnake();
    }

    function prepareBrick() {
      gameTitle.textContent = 'Cyber Breakout';
      touchPad.classList.remove('visible');
      controlsText.innerHTML = '<span><kbd>←</kbd> <kbd>→</kbd> ou souris/toucher pour bouger</span><span><kbd>Espace</kbd> pause / reprise</span><span>Attrape les bonus néon libérés par certaines briques</span>';
      resetBrick(true);
      drawBrick();
      showMessage('Connexion au réseau', 'Détruis tous les pare-feux néon avec ta balle plasma. Déplace la raquette au clavier, à la souris ou au toucher.', 'Lancer la partie');
    }

    function resetBrick(fullReset = true) {
      if (fullReset) {
        brick.score = 0;
        brick.lives = 3;
        brick.level = 1;
      }
      brick.particles = [];
      brick.powerUps = [];
      brick.activeEffects = [];
      brick.paddle.w = 145;
      brick.paddle.speed = 9;
      brick.ball.r = 8;
      buildBrickWall();
      resetBrickBall();
      setHud(brick.score, 'Vies', brick.lives, 'Niveau', brick.level, 'Breakout');
    }

    function resetBrickBall() {
      brick.paddle.x = (canvas.width - brick.paddle.w) / 2;
      brick.ball.x = canvas.width / 2;
      brick.ball.y = brick.paddle.y - 24;
      const speed = 5.5 + brick.level * 0.45;
      brick.ball.vx = (Math.random() > 0.5 ? 1 : -1) * speed;
      brick.ball.vy = -speed;
      brick.ball.trail = [];
    }

    function buildBrickWall() {
      brick.bricks = [];
      const rows = Math.min(5 + brick.level, 8);
      const cols = 10;
      const gap = 10;
      const top = 78;
      const brickW = (canvas.width - 92 - gap * (cols - 1)) / cols;
      const colors = ['#00f5ff', '#ff2bd6', '#b6ff00', '#7c3cff'];

      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          brick.bricks.push({
            x: 46 + col * (brickW + gap),
            y: top + row * 28,
            w: brickW,
            h: 18,
            hp: row % 3 === 0 && brick.level > 1 ? 2 : 1,
            color: colors[(row + col) % colors.length]
          });
        }
      }
    }

    function startBrick(reset = true) {
      if (reset) resetBrick(true);
      else resetBrickBall();
      app.running = true;
      app.paused = false;
      hideMessage();
      loop(performance.now());
    }

    function nextBrickLevel() {
      brick.level += 1;
      resetBrick(false);
      app.running = false;
      showMessage('Niveau franchi', 'Le réseau se renforce : les briques deviennent plus nombreuses, plus solides et plus généreuses en bonus.', 'Continuer');
    }

    function createBurst(store, x, y, color, amount = 16) {
      for (let i = 0; i < amount; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        store.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 36 + Math.random() * 20, color });
      }
    }

    function maybeDropPowerUp(hitBrick) {
      const powerUpTypes = [
        { type: 'wide', label: 'Raquette XL', color: '#00f5ff', symbol: '↔', duration: 620 },
        { type: 'slow', label: 'Ralenti plasma', color: '#b6ff00', symbol: '◌', duration: 520 },
        { type: 'shield', label: 'Bouclier', color: '#ff2bd6', symbol: '▰', duration: 700 }
      ];
      const dropChance = Math.min(0.18 + brick.level * 0.025, 0.34);
      if (Math.random() > dropChance) return;
      const bonus = powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)];
      brick.powerUps.push({ ...bonus, x: hitBrick.x + hitBrick.w / 2, y: hitBrick.y + hitBrick.h / 2, r: 13, vy: 2.15 + brick.level * 0.12, spin: 0, pulse: 0 });
      createBurst(brick.particles, hitBrick.x + hitBrick.w / 2, hitBrick.y + hitBrick.h / 2, bonus.color, 24);
    }

    function activatePowerUp(powerUp) {
      createBurst(brick.particles, powerUp.x, powerUp.y, powerUp.color, 34);
      brick.score += 35 * brick.level;
      const existing = brick.activeEffects.find(effect => effect.type === powerUp.type);
      if (existing) existing.time = powerUp.duration;
      else brick.activeEffects.push({ type: powerUp.type, label: powerUp.label, color: powerUp.color, time: powerUp.duration });
      if (powerUp.type === 'wide') brick.paddle.w = Math.min(225, 145 * 1.55);
      if (powerUp.type === 'shield') brick.ball.r = 11;
      setHud(brick.score, 'Vies', brick.lives, 'Niveau', brick.level, 'Breakout');
    }

    function updateBrick() {
      if (app.keys.has('ArrowLeft') || app.keys.has('KeyA')) brick.paddle.x -= brick.paddle.speed;
      if (app.keys.has('ArrowRight') || app.keys.has('KeyD')) brick.paddle.x += brick.paddle.speed;
      brick.paddle.x = Math.max(10, Math.min(canvas.width - brick.paddle.w - 10, brick.paddle.x));

      brick.activeEffects.forEach(effect => { effect.time -= 1; });
      const stillActive = brick.activeEffects.filter(effect => effect.time > 0);
      const expired = brick.activeEffects.filter(effect => effect.time <= 0);
      brick.activeEffects = stillActive;
      if (expired.some(effect => effect.type === 'wide') && !stillActive.some(effect => effect.type === 'wide')) brick.paddle.w = 145;
      if (expired.some(effect => effect.type === 'shield') && !stillActive.some(effect => effect.type === 'shield')) brick.ball.r = 8;

      brick.powerUps.forEach(powerUp => {
        powerUp.y += powerUp.vy;
        powerUp.spin += 0.08;
        powerUp.pulse += 0.16;
      });
      brick.powerUps = brick.powerUps.filter(powerUp => {
        const caught = powerUp.y + powerUp.r >= brick.paddle.y && powerUp.y - powerUp.r <= brick.paddle.y + brick.paddle.h && powerUp.x >= brick.paddle.x && powerUp.x <= brick.paddle.x + brick.paddle.w;
        if (caught) {
          activatePowerUp(powerUp);
          return false;
        }
        return powerUp.y - powerUp.r <= canvas.height;
      });

      brick.ball.trail.unshift({ x: brick.ball.x, y: brick.ball.y });
      brick.ball.trail = brick.ball.trail.slice(0, 12);
      const slow = brick.activeEffects.some(effect => effect.type === 'slow') ? 0.72 : 1;
      brick.ball.x += brick.ball.vx * slow;
      brick.ball.y += brick.ball.vy * slow;

      if (brick.ball.x + brick.ball.r > canvas.width || brick.ball.x - brick.ball.r < 0) brick.ball.vx *= -1;
      if (brick.ball.y - brick.ball.r < 0) brick.ball.vy *= -1;

      const paddleHit = brick.ball.x > brick.paddle.x && brick.ball.x < brick.paddle.x + brick.paddle.w && brick.ball.y + brick.ball.r > brick.paddle.y && brick.ball.y - brick.ball.r < brick.paddle.y + brick.paddle.h;
      if (paddleHit && brick.ball.vy > 0) {
        const impact = (brick.ball.x - (brick.paddle.x + brick.paddle.w / 2)) / (brick.paddle.w / 2);
        brick.ball.vx = impact * (6.2 + brick.level * 0.24);
        brick.ball.vy *= -1;
        createBurst(brick.particles, brick.ball.x, brick.paddle.y, '#00f5ff', 10);
      }

      for (const hitBrick of brick.bricks) {
        const hit = brick.ball.x + brick.ball.r > hitBrick.x && brick.ball.x - brick.ball.r < hitBrick.x + hitBrick.w && brick.ball.y + brick.ball.r > hitBrick.y && brick.ball.y - brick.ball.r < hitBrick.y + hitBrick.h;
        if (hit) {
          brick.ball.vy *= -1;
          hitBrick.hp -= 1;
          brick.score += 10 * brick.level;
          createBurst(brick.particles, brick.ball.x, brick.ball.y, hitBrick.color, 14);
          if (hitBrick.hp <= 0) maybeDropPowerUp(hitBrick);
          setHud(brick.score, 'Vies', brick.lives, 'Niveau', brick.level, 'Breakout');
          break;
        }
      }

      brick.bricks = brick.bricks.filter(hitBrick => hitBrick.hp > 0);
      if (brick.bricks.length === 0) nextBrickLevel();

      if (brick.ball.y - brick.ball.r > canvas.height) {
        brick.lives -= 1;
        createBurst(brick.particles, brick.ball.x, canvas.height - 20, '#ff2bd6', 28);
        if (brick.lives <= 0) {
          app.running = false;
          showMessage('Système compromis', `Score final : ${brick.score}. Relance une attaque pour reprendre le réseau.`, 'Rejouer');
        } else resetBrickBall();
        setHud(brick.score, 'Vies', brick.lives, 'Niveau', brick.level, 'Breakout');
      }

      updateParticles(brick.particles);
    }

    function prepareSnake() {
      gameTitle.textContent = 'Snake Cyber';
      controlsText.innerHTML = '<span><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> ou gestes tactiles pour diriger</span><span><kbd>Espace</kbd> pause / reprise</span><span>Mange un mot, réponds au quiz, grandis ou rétrécis</span>';
      touchPad.classList.add('visible');
      resetSnake();
      drawSnake();
      showMessage('Snake Cyber', 'Avalez des mots cyber, puis répondez au quiz : bonne réponse = croissance, mauvaise réponse = réduction du serpent.', 'Lancer la partie');
    }

    function resetSnake() {
      snake.score = 0;
      snake.lives = 3;
      snake.streak = 0;
      snake.tickMs = 150;
      snake.lastTick = 0;
      snake.direction = { x: 1, y: 0 };
      snake.nextDirection = { x: 1, y: 0 };
      snake.body = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 },
        { x: 5, y: 10 }
      ];
      snake.pendingGrowth = 0;
      snake.quizOpen = false;
      snake.particles = [];
      spawnFood();
      setHud(snake.score, 'Vies', snake.lives, 'Taille', snake.body.length, 'Snake');
    }

    function startSnake(reset = true) {
      if (reset) resetSnake();
      app.running = true;
      app.paused = false;
      hideMessage();
      loop(performance.now());
    }

    function spawnFood() {
      const item = quizBank[Math.floor(Math.random() * quizBank.length)];
      let position;
      do {
        position = {
          x: 2 + Math.floor(Math.random() * (snake.cols - 4)),
          y: 2 + Math.floor(Math.random() * (snake.rows - 4))
        };
      } while (snake.body.some(segment => segment.x === position.x && segment.y === position.y));
      snake.food = { ...position, item, pulse: 0 };
    }

    function setSnakeDirection(x, y) {
      if (app.mode !== 'snake' || snake.quizOpen) return;
      if (snake.direction.x + x === 0 && snake.direction.y + y === 0) return;
      snake.nextDirection = { x, y };
    }

    function updateSnake(time) {
      if (snake.quizOpen || time - snake.lastTick < snake.tickMs) {
        updateParticles(snake.particles);
        if (snake.food) snake.food.pulse += 0.08;
        return;
      }
      snake.lastTick = time;
      snake.direction = snake.nextDirection;
      const head = snake.body[0];
      const nextHead = { x: head.x + snake.direction.x, y: head.y + snake.direction.y };

      const crashed = nextHead.x < 0 || nextHead.x >= snake.cols || nextHead.y < 0 || nextHead.y >= snake.rows || snake.body.some(segment => segment.x === nextHead.x && segment.y === nextHead.y);
      if (crashed) {
        snake.lives -= 1;
        createBurst(snake.particles, (head.x + 0.5) * snake.cell, (head.y + 0.5) * snake.cell, '#ff2bd6', 26);
        if (snake.lives <= 0) {
          app.running = false;
          showMessage('Serpent neutralisé', `Score final : ${snake.score}. Les journaux indiquent ${snake.streak} bonne(s) réponse(s) de suite au maximum.`, 'Rejouer');
        } else {
          snake.body = snake.body.slice(0, Math.max(3, snake.body.length - 2));
          snake.direction = { x: 1, y: 0 };
          snake.nextDirection = { x: 1, y: 0 };
          snake.body[0] = { x: 8, y: 10 };
        }
        setHud(snake.score, 'Vies', snake.lives, 'Taille', snake.body.length, 'Snake');
        return;
      }

      snake.body.unshift(nextHead);
      const ateFood = snake.food && nextHead.x === snake.food.x && nextHead.y === snake.food.y;
      if (ateFood) {
        snake.quizItem = snake.food.item;
        snake.pendingGrowth = 1;
        snake.score += 25;
        createBurst(snake.particles, (nextHead.x + 0.5) * snake.cell, (nextHead.y + 0.5) * snake.cell, '#b6ff00', 30);
        openQuiz(snake.quizItem);
      }

      if (snake.pendingGrowth > 0) snake.pendingGrowth -= 1;
      else snake.body.pop();
      setHud(snake.score, 'Vies', snake.lives, 'Taille', snake.body.length, 'Snake');
    }

    function openQuiz(item) {
      snake.quizOpen = true;
      app.paused = true;
      quizQuestion.textContent = `[${item.theme}] ${item.question}`;
      quizResult.textContent = '';
      quizOptions.innerHTML = '';
      const answers = [
        { text: item.good, good: true },
        { text: item.almost, good: false },
        { text: item.bad, good: false }
      ].sort(() => Math.random() - 0.5);
      answers.forEach(answer => {
        const button = document.createElement('button');
        button.textContent = answer.text;
        button.addEventListener('click', () => answerQuiz(answer.good, item));
        quizOptions.append(button);
      });
      quizModal.classList.remove('hidden');
    }

    function answerQuiz(isGood, item) {
      quizOptions.querySelectorAll('button').forEach(button => { button.disabled = true; });
      if (isGood) {
        snake.pendingGrowth += 2;
        snake.streak += 1;
        snake.score += 100 + snake.streak * 15;
        snake.tickMs = Math.max(88, snake.tickMs - 3);
        quizResult.textContent = 'Bonne réponse : le serpent consolide sa chaîne de défense.';
        quizResult.style.color = '#b6ff00';
      } else {
        snake.streak = 0;
        snake.score = Math.max(0, snake.score - 30);
        snake.body = snake.body.slice(0, Math.max(3, snake.body.length - 1));
        quizResult.textContent = `Mauvaise réponse : la bonne piste était « ${item.good} ».`;
        quizResult.style.color = '#ff7bcb';
      }
      setHud(snake.score, 'Vies', snake.lives, 'Taille', snake.body.length, 'Snake');
      setTimeout(() => {
        quizModal.classList.add('hidden');
        snake.quizOpen = false;
        app.paused = false;
        spawnFood();
        loop(performance.now());
      }, 1600);
    }

    function updateParticles(particles) {
      particles.forEach(particle => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.03;
        particle.life -= 1;
      });
      const living = particles.filter(particle => particle.life > 0);
      particles.length = 0;
      particles.push(...living);
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(0, 245, 255, 0.09)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 36) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 36) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawGlowRect(x, y, w, h, color, blur = 14) {
      ctx.save();
      ctx.shadowBlur = blur;
      ctx.shadowColor = color;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
      ctx.restore();
    }

    function drawParticles(particles) {
      particles.forEach(particle => {
        ctx.save();
        ctx.globalAlpha = Math.min(1, particle.life / 30);
        ctx.shadowBlur = 12;
        ctx.shadowColor = particle.color;
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, 3, 3);
        ctx.restore();
      });
      ctx.globalAlpha = 1;
    }

    function drawMenuBackground() {
      drawGrid();
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 56px Segoe UI';
      ctx.fillStyle = 'rgba(0, 245, 255, 0.25)';
      ctx.shadowBlur = 34;
      ctx.shadowColor = '#00f5ff';
      ctx.fillText('CYBER ARCADE', canvas.width / 2, canvas.height / 2);
      ctx.restore();
    }

    function drawBrick() {
      drawGrid();
      brick.bricks.forEach(hitBrick => {
        drawGlowRect(hitBrick.x, hitBrick.y, hitBrick.w, hitBrick.h, hitBrick.color, 12);
        ctx.fillStyle = hitBrick.hp > 1 ? 'rgba(255,255,255,0.42)' : 'rgba(255,255,255,0.18)';
        ctx.fillRect(hitBrick.x + 4, hitBrick.y + 3, hitBrick.w - 8, 3);
      });

      brick.powerUps.forEach(powerUp => {
        const glow = 9 + Math.sin(powerUp.pulse) * 3;
        ctx.save();
        ctx.translate(powerUp.x, powerUp.y);
        ctx.rotate(powerUp.spin);
        ctx.shadowBlur = 24;
        ctx.shadowColor = powerUp.color;
        ctx.strokeStyle = powerUp.color;
        ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(5, 8, 20, 0.72)';
        ctx.beginPath();
        ctx.arc(0, 0, powerUp.r + glow * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeRect(-8, -8, 16, 16);
        ctx.rotate(-powerUp.spin);
        ctx.fillStyle = '#eaffff';
        ctx.font = 'bold 16px Segoe UI';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(powerUp.symbol, 0, 0);
        ctx.restore();
      });

      const paddleGradient = ctx.createLinearGradient(brick.paddle.x, brick.paddle.y, brick.paddle.x + brick.paddle.w, brick.paddle.y);
      paddleGradient.addColorStop(0, '#ff2bd6');
      paddleGradient.addColorStop(0.5, '#00f5ff');
      paddleGradient.addColorStop(1, '#b6ff00');
      ctx.save();
      ctx.shadowBlur = brick.activeEffects.some(effect => effect.type === 'wide') ? 34 : 22;
      ctx.shadowColor = brick.activeEffects.some(effect => effect.type === 'wide') ? '#b6ff00' : '#00f5ff';
      ctx.fillStyle = paddleGradient;
      ctx.fillRect(brick.paddle.x, brick.paddle.y, brick.paddle.w, brick.paddle.h);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fillRect(brick.paddle.x + 12, brick.paddle.y + 3, brick.paddle.w - 24, 3);
      ctx.restore();

      brick.ball.trail.forEach((point, index) => {
        ctx.beginPath();
        ctx.globalAlpha = Math.max(0, 0.45 - index * 0.035);
        ctx.fillStyle = '#00f5ff';
        ctx.arc(point.x, point.y, brick.ball.r + index * 0.8, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.shadowBlur = brick.activeEffects.some(effect => effect.type === 'shield') ? 34 : 24;
      ctx.shadowColor = brick.activeEffects.some(effect => effect.type === 'shield') ? '#ff2bd6' : brick.activeEffects.some(effect => effect.type === 'slow') ? '#00f5ff' : '#b6ff00';
      ctx.fillStyle = '#eaffff';
      ctx.beginPath();
      ctx.arc(brick.ball.x, brick.ball.y, brick.ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      drawParticles(brick.particles);
    }

    function drawSnake() {
      drawGrid();
      const scaleX = canvas.width / (snake.cols * snake.cell);
      const scaleY = canvas.height / (snake.rows * snake.cell);
      ctx.save();
      ctx.scale(scaleX, scaleY);

      ctx.strokeStyle = 'rgba(182, 255, 0, 0.22)';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, snake.cols * snake.cell, snake.rows * snake.cell);

      if (snake.food) {
        const foodX = snake.food.x * snake.cell;
        const foodY = snake.food.y * snake.cell;
        const pulse = 1 + Math.sin(snake.food.pulse) * 0.08;
        ctx.save();
        ctx.translate(foodX + snake.cell / 2, foodY + snake.cell / 2);
        ctx.scale(pulse, pulse);
        ctx.shadowBlur = 22;
        ctx.shadowColor = '#ffb000';
        ctx.fillStyle = 'rgba(255, 176, 0, 0.94)';
        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-snake.cell * 1.65, -snake.cell * 0.54, snake.cell * 3.3, snake.cell * 1.08, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#06101a';
        ctx.font = '800 10px Segoe UI';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(snake.food.item.word.toUpperCase(), 0, 0, snake.cell * 3.05);
        ctx.restore();
      }

      snake.body.forEach((segment, index) => {
        const x = segment.x * snake.cell;
        const y = segment.y * snake.cell;
        const isHead = index === 0;
        ctx.save();
        ctx.shadowBlur = isHead ? 28 : 16;
        ctx.shadowColor = isHead ? '#00f5ff' : '#b6ff00';
        ctx.fillStyle = isHead ? '#00f5ff' : `rgba(182, 255, 0, ${Math.max(0.38, 1 - index * 0.035)})`;
        ctx.beginPath();
        ctx.roundRect(x + 2, y + 2, snake.cell - 4, snake.cell - 4, 7);
        ctx.fill();
        if (isHead) {
          ctx.fillStyle = '#06101a';
          ctx.beginPath();
          ctx.arc(x + 9, y + 9, 2.2, 0, Math.PI * 2);
          ctx.arc(x + 16, y + 9, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
      ctx.restore();
      drawParticles(snake.particles);
    }

    function loop(time) {
      cancelAnimationFrame(app.raf);
      if (!app.running || app.paused) return;
      if (app.mode === 'brick') {
        updateBrick();
        drawBrick();
      }
      if (app.mode === 'snake') {
        updateSnake(time);
        drawSnake();
      }
      app.raf = requestAnimationFrame(loop);
    }

    document.querySelectorAll('[data-mode]').forEach(button => {
      button.addEventListener('click', () => chooseMode(button.dataset.mode));
    });

    startButton.addEventListener('click', () => {
      if (app.paused) {
        app.paused = false;
        hideMessage();
        loop(performance.now());
        return;
      }
      if (app.mode === 'brick') startBrick(startButton.textContent !== 'Continuer');
      if (app.mode === 'snake') startSnake(startButton.textContent !== 'Continuer');
    });

    backButton.addEventListener('click', showMenu);

    document.addEventListener('keydown', event => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(event.code)) event.preventDefault();
      if (event.code === 'Space' && app.running && !snake.quizOpen) {
        app.paused = !app.paused;
        if (app.paused) showMessage('Pause activée', 'Le flux est gelé. Appuie sur Espace ou sur le bouton pour reprendre.', 'Reprendre');
        else {
          hideMessage();
          loop(performance.now());
        }
      }
      if (app.mode === 'snake') {
        if (event.code === 'ArrowUp' || event.code === 'KeyW') setSnakeDirection(0, -1);
        if (event.code === 'ArrowDown' || event.code === 'KeyS') setSnakeDirection(0, 1);
        if (event.code === 'ArrowLeft' || event.code === 'KeyA') setSnakeDirection(-1, 0);
        if (event.code === 'ArrowRight' || event.code === 'KeyD') setSnakeDirection(1, 0);
      }
      app.keys.add(event.code);
    });

    document.addEventListener('keyup', event => app.keys.delete(event.code));

    canvas.addEventListener('pointermove', event => {
      if (app.mode !== 'brick') return;
      const rect = canvas.getBoundingClientRect();
      const ratio = canvas.width / rect.width;
      brick.paddle.x = (event.clientX - rect.left) * ratio - brick.paddle.w / 2;
      brick.paddle.x = Math.max(10, Math.min(canvas.width - brick.paddle.w - 10, brick.paddle.x));
    });

    let touchStart = null;
    canvas.addEventListener('pointerdown', event => {
      if (app.mode === 'brick' && !app.running) startBrick(startButton.textContent !== 'Continuer');
      if (app.mode === 'snake') touchStart = { x: event.clientX, y: event.clientY };
    });
    canvas.addEventListener('pointerup', event => {
      if (app.mode !== 'snake' || !touchStart) return;
      const dx = event.clientX - touchStart.x;
      const dy = event.clientY - touchStart.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) setSnakeDirection(Math.sign(dx), 0);
      else setSnakeDirection(0, Math.sign(dy));
      touchStart = null;
    });

    touchPad.querySelectorAll('[data-dir]').forEach(button => {
      button.addEventListener('click', () => {
        const dir = button.dataset.dir;
        if (dir === 'up') setSnakeDirection(0, -1);
        if (dir === 'down') setSnakeDirection(0, 1);
        if (dir === 'left') setSnakeDirection(-1, 0);
        if (dir === 'right') setSnakeDirection(1, 0);
      });
    });

    showMenu();
  </script>
</body>
</html>
