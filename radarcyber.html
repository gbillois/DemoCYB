<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <title>2025 French Cybersecurity Innovation Radar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07071a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    h1 {
      color: #ccd6f6;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 14px;
      opacity: .6;
    }

    /* ── Radar wrapper ── */
    #radar-wrap {
      position: relative;
      width: 100%;
      max-width: 1280px;
      line-height: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.7);
    }

    #radar-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* ── Overlay layer (covers the image exactly) ── */
    #overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none; /* individual chips set their own */
    }

    /* ── Logo chip ── */
    .lc {
      position: absolute;
      pointer-events: all;
      cursor: pointer;
      border-radius: 3px;
      border: 1.5px solid transparent;
      background: transparent;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .lc:hover {
      border-color: var(--c);
      background: color-mix(in srgb, var(--c) 12%, transparent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent),
                  0 0 10px color-mix(in srgb, var(--c) 45%, transparent);
      z-index: 50;
    }

    /* ── Popup backdrop ── */
    #pop-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      z-index: 900;
      justify-content: center;
      align-items: center;
    }
    #pop-bg.on { display: flex; }

    /* ── Popup card ── */
    #pop-card {
      background: linear-gradient(145deg, #12122a, #0e1730);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 28px 30px 26px;
      width: min(500px, 92vw);
      color: #dde3f4;
      box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
      position: relative;
      animation: popIn .18s cubic-bezier(.22,1,.36,1);
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(.93) translateY(8px); }
      to   { opacity:1; transform: scale(1)  translateY(0); }
    }

    #pop-close {
      position: absolute;
      top: 10px; right: 14px;
      background: none; border: none;
      font-size: 22px; line-height: 1;
      color: #556; cursor: pointer;
      transition: color .15s;
    }
    #pop-close:hover { color: #fff; }

    #pop-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    #pop-name {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 14px;
    }

    #pop-body {
      font-size: 13.5px;
      line-height: 1.65;
      color: #8ea0c4;
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 13px;
      min-height: 52px;
    }
    #pop-body.ph { font-style: italic; color: #445; }

    /* ── Dev-mode helpers ── */
    #dev-bar {
      display: none;
      position: fixed;
      bottom: 14px; right: 14px;
      z-index: 1000;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    #dev-bar.on { display: flex; }

    #dev-label {
      background: rgba(255,80,0,.9);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    #dev-coord {
      background: rgba(0,0,0,.85);
      color: #0f0;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
    }

    /* ── Legend ── */
    #legend {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 1280px;
      padding: 0 10px;
    }
    .leg-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      color: #8898bb;
    }
    .leg-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>

// ══════════════════════════════════════════════════════════════════════════════
//  BUILD OVERLAYS
// ══════════════════════════════════════════════════════════════════════════════
const overlayLayer = document.getElementById('overlay-layer');

LOGOS.forEach(logo => {
  const sec = SECTIONS[logo.section];
  const color = sec ? sec.color : '#ffffff';

  const el = document.createElement('div');
  el.className = 'lc';
  el.dataset.id = logo.id;
  el.dataset.section = logo.section;
  el.style.cssText = `
    left: ${logo.x}%;
    top:  ${logo.y}%;
    width:  ${logo.w}%;
    height: ${logo.h}%;
    --c: ${color};
  `;
  el.title = logo.name;

  el.addEventListener('click', e => { e.stopPropagation(); openPopup(logo); });
  overlayLayer.appendChild(el);
});

// ══════════════════════════════════════════════════════════════════════════════
//  POPUP
// ══════════════════════════════════════════════════════════════════════════════
const popBg    = document.getElementById('pop-bg');
const popName  = document.getElementById('pop-name');
const popBadge = document.getElementById('pop-badge');
const popBody  = document.getElementById('pop-body');

function openPopup(logo) {
  const sec   = SECTIONS[logo.section] || { label: logo.section, color: '#fff' };
  const color = sec.color;

  popBadge.textContent  = sec.label;
  popBadge.style.cssText = `
    background: ${color}22;
    color: ${color};
    border: 1px solid ${color}44;
  `;

  popName.textContent = logo.name;

  if (logo.content) {
    popBody.innerHTML = logo.content;
    popBody.classList.remove('ph');
  } else {
    popBody.textContent = 'Data coming soon…';
    popBody.classList.add('ph');
  }

  popBg.classList.add('on');
}

function closePopup() { popBg.classList.remove('on'); }

document.getElementById('pop-close').addEventListener('click', closePopup);
popBg.addEventListener('click', e => { if (e.target === popBg) closePopup(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

//  LEGEND
// ══════════════════════════════════════════════════════════════════════════════
const legendEl = document.getElementById('legend');
// Deduplicate section labels shown in legend (skip "scaleup-*" variants)
const legendSections = [
  'watermarking','artificial-intelligence','iot-security',
  'vulnerabilities','attack-surface','anti-fraud',
  'endpoints','awareness','privacy','governance',
  'secure-data','threat-intelligence','cyber-range','crisis-management',
  'data-security','cloud-security','application-security',
  'identity-access','network-security','surveillance','incident-response',
  'scaleup-govern','scaleup-identify','scaleup-protect',
  'scaleup-detect','scaleup-respond','scaleup-recover','unicorn'
];
legendSections.forEach(key => {
  const sec = SECTIONS[key];
  if (!sec) return;
  const item = document.createElement('div');
  item.className = 'leg-item';
  item.innerHTML = `<span class="leg-dot" style="background:${sec.color}"></span>${sec.label}`;
  legendEl.appendChild(item);
});

// ══════════════════════════════════════════════════════════════════════════════
//  DEV MODE  (Ctrl+D)
//  Shows real-time percentage coordinates — helps you fine-tune logo positions
// ══════════════════════════════════════════════════════════════════════════════
let devMode = false;
const devBar   = document.getElementById('dev-bar');
const devCoord = document.getElementById('dev-coord');
const radarImg = document.getElementById('radar-img');

document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    devMode = !devMode;
    devBar.classList.toggle('on', devMode);
    overlayLayer.style.outline = devMode ? '1px dashed rgba(255,80,0,.3)' : '';
    // In dev mode, tint every chip slightly so outlines are visible
    document.querySelectorAll('.lc').forEach(el => {
      el.style.border = devMode
        ? `1px dashed ${el.style.getPropertyValue('--c')}88`
        : '1.5px solid transparent';
    });
  }
});

document.getElementById('radar-wrap').addEventListener('mousemove', e => {
  if (!devMode) return;
  const r  = radarImg.getBoundingClientRect();
  const xp = ((e.clientX - r.left)  / r.width  * 100).toFixed(1);
  const yp = ((e.clientY - r.top)   / r.height * 100).toFixed(1);
  devCoord.textContent = `x: ${xp}%  y: ${yp}%`;
});

// Click in dev mode logs the logo data snippet to console
document.getElementById('radar-wrap').addEventListener('click', e => {
  if (!devMode) return;
  const r  = radarImg.getBoundingClientRect();
  const xp = ((e.clientX - r.left)  / r.width  * 100).toFixed(1);
  const yp = ((e.clientY - r.top)   / r.height * 100).toFixed(1);
  console.log(`{ id:"", name:"", section:"", x:${xp}, y:${yp}, w:8, h:3.5 },`);
});
